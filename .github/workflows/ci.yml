name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu-latest, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check plugin entry points
        run: |
          node --check index.mjs
          node --check client.js

      - name: Validate JSON files
        run: |
          node -e "const fs = require('node:fs'); for (const file of ['package.json', 'locale/en.json', 'locale/zh.json']) { JSON.parse(fs.readFileSync(file, 'utf8')); console.log('valid JSON:', file); }"

      - name: Run offline Node test suite
        run: node tests/node/run-all.mjs
